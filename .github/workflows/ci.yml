name: CI
# Runs on pull requests and when started by hand (Actions tab or `gh workflow run ci.yml --ref <branch>`), not on every
# push: the Windows job alone takes about 45 minutes.
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows suite spawns Git thousands of times and takes about 35 minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Install Git LFS
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y git-lfs; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install git-lfs; fi
          git lfs version
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:en
