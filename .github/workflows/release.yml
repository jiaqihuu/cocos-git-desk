name: Release
# Started by hand on a tag: `gh workflow run release.yml --ref vX.Y.Z`. A release can also be built locally with
# `npm run package` and uploaded with `gh release create`.
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.zip
            releases/*.sha256
          generate_release_notes: true
